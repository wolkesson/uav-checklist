# Dependabot opens pull requests for dependency updates. Every update PR goes
# through the normal checks: CI, the browser smoke test and a Cloudflare preview.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # One PR per week for all minor/patch updates, instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    # Major updates come as separate PRs, since they can need code changes.
    ignore:
      # Node type definitions follow the Node version in .node-version, which we
      # change deliberately (CI, Cloudflare and dev machines together).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is blocked until svelte-check supports it (see issue #9).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
