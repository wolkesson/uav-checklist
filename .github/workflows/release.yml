name: Release offline package
# Builds the offline zip and attaches it to the GitHub release for the tag.
# Works both ways: pushing a vX.Y.Z tag, or creating/publishing the release on github.com
# (which creates the tag). If both events fire, the runs queue and give the same result.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit where package.json says version $v. Tag the commit where package.json says ${GITHUB_REF_NAME#v} (usually the latest main)."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:offline
      - name: Attach the zip to the release (create the release if it doesn't exist)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
